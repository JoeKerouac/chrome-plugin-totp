<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TOTP配置管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 300;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .configs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .config-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            height: fit-content;
        }
        
        .config-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        
        /* 变更高亮样式 */
        .config-item.changed {
            border-color: #ff6b6b;
            box-shadow: 0 8px 32px rgba(255, 107, 107, 0.2);
            background: linear-gradient(135deg, #fff 0%, #fff5f5 100%);
        }
        
        .config-item.new-item {
            border-color: #4facfe;
            box-shadow: 0 8px 32px rgba(79, 172, 254, 0.2);
            background: linear-gradient(135deg, #fff 0%, #f0f8ff 100%);
        }
        
        .config-item.deleted {
            border-color: #999;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            background: linear-gradient(135deg, #f8f8f8 0%, #e8e8e8 100%);
            opacity: 0.6;
        }
        
        .config-item.deleted input {
            background: #f0f0f0;
            color: #999;
            pointer-events: none;
        }
        
        .btn-undo {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }
        
        .btn-undo:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }
        
        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .config-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .form-row.two-cols {
            grid-template-columns: 1fr 1fr;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        label {
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            font-size: 13px;
        }
        
        input {
            padding: 10px 12px;
            border: 2px solid #e1e5e9;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafbfc;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }
        
        /* 字段变更高亮 */
        input.field-changed {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, #fff 0%, #fff5f5 100%);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }
        
        input.field-changed:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2);
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }
        
        .actions {
            text-align: center;
            margin: 30px 0;
        }
        
        .actions .btn {
            margin: 0 10px;
            padding: 12px 24px;
            font-size: 14px;
        }
        
        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        
        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 12px;
            opacity: 0.9;
        }
        
        .empty-state p {
            font-size: 16px;
            opacity: 0.7;
            margin-bottom: 24px;
        }
        
        .placeholder-text {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
        
        /* 保存按钮脉冲动画 */
        @keyframes pulse {
            0% { box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3); }
            50% { box-shadow: 0 4px 25px rgba(255, 107, 107, 0.6); }
            100% { box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3); }
        }
        
        /* 保存通知样式 */
        .save-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
            min-width: 280px;
        }
        
        .save-notification.show {
            transform: translateX(0);
        }
        
        .save-notification.success {
            border-left: 4px solid #4CAF50;
        }
        
        .save-notification.error {
            border-left: 4px solid #ff6b6b;
        }
        
        .notification-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .notification-icon {
            font-size: 20px;
        }
        
        .notification-text {
            font-weight: 500;
            color: #333;
        }
        
        /* 响应式断点 */
        @media (max-width: 1200px) {
            .configs-grid {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            }
        }
        
        @media (max-width: 768px) {
            .configs-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            
            .config-item {
                padding: 16px;
            }
            
            .form-row.two-cols {
                grid-template-columns: 1fr;
            }
            
            .actions .btn {
                display: block;
                margin: 10px auto;
                width: 200px;
            }
            
            .save-notification {
                right: 10px;
                left: 10px;
                min-width: auto;
                transform: translateY(-100px);
            }
            
            .save-notification.show {
                transform: translateY(0);
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 10px;
            }
            
            .configs-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .config-item {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 TOTP配置管理</h1>
        
        <div class="configs-grid" id="configs"></div>
        
        <div class="actions">
            <button class="btn btn-success">+ 添加新配置</button>
            <button class="btn btn-primary">💾 保存所有配置</button>
            <button class="btn btn-secondary" id="export-btn">📤 导出配置</button>
            <button class="btn btn-secondary" id="import-btn">📥 导入配置</button>
            <input type="file" id="import-file" accept=".json" style="display: none;">
        </div>
    </div>
    
    <script src="options.js"></script>
</body>
</html>
